[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-instructions"
version = "1.0.0"
description = "Модульная библиотека системных инструкций и инженерных навыков для ИИ-агентов"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Ernst" }
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]
math = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "pillow>=9.5.0",
]
docs = [
    "python-docx>=1.1.0",
    "latex2mathml>=3.76.0",
    "lxml>=5.0.0",
    "pillow>=9.5.0",
]
win32 = [
    "pywin32>=306; sys_platform == 'win32'",
    "pywinauto>=0.6.8; sys_platform == 'win32'",
]
all = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "pillow>=9.5.0",
    "python-docx>=1.1.0",
    "latex2mathml>=3.76.0",
    "lxml>=5.0.0",
    "pywin32>=306; sys_platform == 'win32'",
    "pywinauto>=0.6.8; sys_platform == 'win32'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]
