; PlatformIO project for Wemos (LOLIN) D1 mini - ESP8266, Arduino framework.
; Commands:  pio run | pio run -t upload | pio device monitor | pio run -t upload -t monitor

[platformio]
default_envs = d1_mini

[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino

; Serial monitor: must match Serial.begin() in main.cpp
monitor_speed = 115200
; Decode "Exception (N)" stack dumps into file:line (uses the ELF of this build)
monitor_filters = esp8266_exception_decoder, default

; Faster upload through the CH340 USB-UART; drop to 115200 if uploads fail
upload_speed = 921600
; upload_port = COM5          ; uncomment if auto-detection picks the wrong port

; Warnings for OUR sources in src/ only (framework code is not ours to fix).
; NOTE: build_src_flags do NOT apply to lib/<name>/ - give each own library a
; lib/<name>/library.json with  "build": { "flags": ["-Wall", "-Wextra"] }
build_src_flags =
    -Wall
    -Wextra
; Project-wide defines
build_flags =
    -D FW_VERSION=\"0.1.0\"
    -D LOG_LEVEL=2

; CPU clock: 80 MHz by default; 160 MHz = faster, more current
; board_build.f_cpu = 160000000L

; Flash layout 4 MB: 2 MB sketch area / 2 MB LittleFS
; board_build.ldscript = eagle.flash.4m2m.ld
; board_build.filesystem = littlefs

; Unit tests of hardware-independent modules on the PC (needs gcc in PATH):
; pio test -e native
[env:native]
platform = native
build_flags = -std=c99 -Wall -Wextra
test_build_src = no
